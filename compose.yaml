services:
  web:
    build:
      context: .
      target: runtime
    image: memilmuk82-portfolio:local
    init: true
    environment:
      PORTFOLIO_SECRET_KEY: ${PORTFOLIO_SECRET_KEY:?Set PORTFOLIO_SECRET_KEY in the environment}
      PORTFOLIO_GITHUB_URL: ${PORTFOLIO_GITHUB_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 10s
