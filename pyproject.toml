[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memilmuk82-portfolio"
version = "0.1.0"
description = "검증된 공개 프로젝트를 소개하는 Flask/Jinja 포트폴리오"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["app/static/css/site.css"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
